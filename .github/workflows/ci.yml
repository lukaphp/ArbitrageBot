name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # BLOCCA il traffico di rete in uscita non elencato (CI-01, Sprint 2 Release 2).
      # Prima era `audit`, che osservava senza impedire: serviva accumulare run puliti
      # per sapere cosa è legittimo. Ora l'allowlist è compilata e la policy chiude.
      #
      # SHA pinnato al tag v2 (v2.20.1) di step-security/harden-runner, verificato via
      # GitHub API il 2026-08-07: https://api.github.com/repos/step-security/harden-runner/git/refs/tags/v2
      #
      # ── Da dove viene questa lista (verificata il 2026-08-12) ──────────────────────
      # Non è la lista generica "npm + GitHub": è l'unione degli endpoint OSSERVATI su
      # 31 run in audit dal 9 al 12 agosto, PIÙ due scoperti solo dal primo run reale in
      # block (vedi "PERCHÉ L'AUDIT NON BASTAVA"). Fonte: il passo `Post Harden Runner`
      # riversa nel log del job il registro dell'agente, con righe
      # `endpoint called ip address:port <ip>:<porta>, domain: <host>, process: <proc>`.
      # Il campo `process` è la ragione per cui ho letto il log invece della pagina
      # insights: è quello che distingue il traffico DEL JOB da quello del runner.
      # Per rileggerli:
      #   gh run view <run-id> --log | grep -E "endpoint called|domain not allowed"
      #
      # Ogni voce, con il processo che l'ha chiamata e il passo che la causa:
      #   github.com                       git-remote-http    Checkout (fetch del repo)
      #   registry.npmjs.org               node               npm ci, npm rebuild, npm audit
      #   tuf-repo-cdn.sigstore.dev        node               npm audit signatures (radice TUF)
      #   results-receiver.actions.…       node/Runner.Worker servizio results di Actions
      #   release-assets.githubusercontent prebuild-install   binario precompilato better-sqlite3
      #   nodejs.org                       node-gyp           header di Node, se la compilazione
      #                                                       deve partire davvero (fallback)
      #   agent.api.stepsecurity.io        (agente)           regole di detection di harden-runner
      #   prod.app-api.stepsecurity.io     (agente)           telemetria di harden-runner
      #
      # ── PERCHÉ L'AUDIT NON BASTAVA, e va saputo prima di fidarsi di dati di audit ──
      # I 31 run in audit NON hanno mai mostrato `release-assets.githubusercontent.com`
      # né `nodejs.org`, e il primo run in block è fallito esattamente su quei due, al
      # passo `rebuild:native`. Il motivo NON è che l'osservazione fosse troppo corta:
      # tutti e 31 girarono sullo stesso branch con la cache npm CALDA. `prebuild-install`
      # tiene il binario già compilato in `~/.npm/_prebuilds`, che sta DENTRO la directory
      # che `setup-node` mette in cache con `cache: 'npm'` — quindi trovava il .node in
      # locale e non usciva in rete. Al primo run con cache fredda ("npm cache is not
      # found", perché le cache di Actions non sono condivise tra branch paralleli)
      # `prebuild-install` è andato in rete, è stato bloccato, e il fallback
      # `node-gyp rebuild` ha chiesto gli header a nodejs.org, bloccato anche lui.
      # Lezione riutilizzabile: un audit su cache calda descrive UN SOLO cammino di rete.
      # Qui non era un rischio teorico — la cache si invalida a ogni cambio di
      # package-lock.json, quindi la CI si sarebbe rotta al primo aggiornamento di
      # dipendenze, cioè lontano da questa modifica e in modo difficile da collegare.
      #
      # Le due voci stepsecurity.io sono ESPLICITE anche se nei log di audit compaiono
      # solo come `domain resolved` e mai come `endpoint called` — cioè l'agente pare
      # escludere il proprio traffico dal monitoraggio, e quindi probabilmente se lo
      # auto-consente. "Probabilmente" non basta per una policy che può rompere la CI:
      # step-security/agent è un repo privato, quel comportamento non è verificabile
      # leggendo il codice, ed elencarle costa zero.
      #
      # NON elencati di proposito:
      # - hosted-compute-{watchdog,request-orchestrator}-prod-{iad,eus}-0N.githubapp.com,
      #   chiamati dal processo `provjobd` (il demone di provisioning della VM, non il
      #   job). Il suffisso di regione ruota — ne ho visti 4 diversi su 31 run — quindi
      #   elencarli sarebbe inseguire un bersaglio mobile per traffico che non è nostro.
      #   ONESTÀ SUL RUN DI VERIFICA: uno di questi (watchdog-prod-iad-01) compare
      #   DAVVERO come `domain not allowed` nel run in block, e va saputo invece di
      #   scoprirlo la prossima volta. Non è un falso positivo sul job: è l'heartbeat che
      #   la VM manda a GitHub, tutti e 15 gli step del run sono verdi (592/592 test,
      #   incluso il salvataggio cache nel Post step), e in audit compariva a
      #   intermittenza (7 run su 31 per quel solo host). Resta un punto da guardare: se
      #   un domani quell'heartbeat diventasse necessario al completamento del job, il
      #   sintomo sarebbe un job instabile senza errori negli step.
      # - productionresultssaNN.blob.core.windows.net (cache di Actions): NON va scritto
      #   a mano. Il numero ruota davvero — misurato sa12 in tutti e 31 i run di audit e
      #   sa10 al primo run in block — e harden-runner risolve da sé l'host corrente e lo
      #   aggiunge a runtime ("Adding cacheHost: … to allowed-endpoints"; nel log in block
      #   si legge sa10 in `Allowed domains:` senza che sia in questa lista). Metterlo
      #   qui significherebbe pubblicare un valore già sbagliato al prossimo giro.
      # - codeload.github.com e actions-results-receiver-production.githubapp.com: risolti
      #   via DNS ma mai contattati, né in audit né in block. Un DNS senza connect non è
      #   un endpoint da consentire.
      #
      # DUE COMPORTAMENTI DI harden-runner DA SAPERE PRIMA DI TOCCARE QUESTA LISTA
      # (letti in src/setup.ts e src/cache.ts allo SHA pinnato, non dedotti):
      # 1. L'auto-aggiunta dell'host di cache descritta sopra avviene solo in block mode e
      #    solo se `isValidEvent()`, che è semplicemente "GITHUB_REF è presente" — vero per
      #    push e pull_request, cioè per entrambi i trigger di questo workflow.
      # 2. Se quella risoluzione FALLISCE, l'action degrada da sola a `audit`
      #    ("Unable to fetch cacheURL" → "Switching egress-policy to audit mode"). È un
      #    fail-open: il job resta verde ma NON sta più bloccando. Non si nota dal solo
      #    esito del run, va cercato nel log del passo Harden Runner.
      #
      # Un endpoint bloccato NON fa fallire il job da solo: harden-runner lo registra come
      # `domain not allowed` e la chiamata fallisce — qui è fallita fino a rompere lo step,
      # ma un blocco su una chiamata non essenziale resterebbe invisibile. Quindi "CI verde"
      # non è la prova che la policy sia giusta: va letto il log in cerca di
      # `domain not allowed`, ed è così che è stata chiusa questa storia.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # In ordine alfabetico (convenzione della policy consigliata da harden-runner):
          # tiene i diff leggibili quando si aggiunge o si toglie una voce.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            github.com:443
            nodejs.org:443
            prod.app-api.stepsecurity.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      # SHA pinnati, non tag: un tag come `v4` è mobile e il proprietario dell'action
      # (o chi ne compromette il repo) può farlo puntare a un commit diverso senza che
      # qui cambi una riga — l'action gira con accesso al workspace e al token del job.
      # Stesso vettore già chiuso per harden-runner sopra (SEC-03, Sprint 1).
      # Risolti dal ref del tag via GitHub API il 2026-08-10:
      #   repos/actions/checkout/git/refs/tags/v4    → 11d5960… (= tag v4.4.0)
      #   repos/actions/setup-node/git/refs/tags/v4  → 49933ea… (= tag v4.4.0)
      # Per aggiornarli: rileggere il ref del tag desiderato dalla stessa API e
      # sostituire SHA *e* commento della versione insieme, mai uno solo dei due.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # .npmrc (ignore-scripts=true, SEC-02) blocca gli script di install di TUTTE le
      # dipendenze, quindi `npm ci` non produce il binario nativo di better-sqlite3.
      # Senza questo step il runner è pulito e i test che aprono davvero SQLite
      # (botDca, riskPersistence) fallirebbero con "Could not locate the bindings file",
      # anche se in locale passano grazie a un .node residuo da un install pre-SEC-02.
      # Lo script sblocca gli script per QUESTO SOLO pacchetto (--ignore-scripts=false):
      # non è un allentamento di .npmrc, che resta attivo per tutto il resto.
      # `cache: 'npm'` di setup-node non copre il caso: mette in cache i tarball, non il
      # binario compilato.
      - name: Ricompila i moduli nativi (better-sqlite3)
        run: npm run rebuild:native

      # Fallisce il job su vulnerabilità note di severità alta o critica senza fix disponibile.
      - name: Audit delle dipendenze (npm audit)
        run: npm audit --audit-level=high

      # Verifica le firme di registry npm per le dipendenze installate (protezione supply-chain).
      - name: Verifica firme del registry npm
        run: npm audit signatures

      - name: Lint (syntax)
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          # Chiave di sviluppo per i test che toccano la cifratura (no segreti reali).
          AGENT_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars
