name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Osserva (non blocca ancora) il traffico di rete in uscita durante il job,
      # per capire quali endpoint sono legittimi prima di passare a egress-policy: block.
      # SHA pinnato al tag v2 (v2.20.1) di step-security/harden-runner, verificato via
      # GitHub API il 2026-08-07: https://api.github.com/repos/step-security/harden-runner/git/refs/tags/v2
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fallisce il job su vulnerabilità note di severità alta o critica senza fix disponibile.
      - name: Audit delle dipendenze (npm audit)
        run: npm audit --audit-level=high

      # Verifica le firme di registry npm per le dipendenze installate (protezione supply-chain).
      - name: Verifica firme del registry npm
        run: npm audit signatures

      - name: Lint (syntax)
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          # Chiave di sviluppo per i test che toccano la cifratura (no segreti reali).
          AGENT_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars
