# Deploy di produzione: app (Node) + Caddy (reverse proxy).
# L'app NON è esposta all'host: solo Caddy pubblica una porta, e solo sull'IP
# Tailscale dell'host (TAILSCALE_IP qui sotto — default 127.0.0.1, mai 0.0.0.0,
# così un .env mancante non pubblica per errore su tutte le interfacce).
# L'app è raggiungibile solo sulla rete interna Docker. SQLite persiste su un
# volume nominato.
#
# TAILSCALE_IP va in un .env locale al VPS (non committato — vedi .gitignore):
#   TAILSCALE_IP=100.x.y.z
# Non è un segreto (è un IP privato nella tailnet), ma è specifico dell'host,
# quindi non appartiene al repository.
#
# Segreti via Infisical (cloud o self-hosted), non .env in chiaro: .infisical-bootstrap.env
# contiene solo le 1-4 variabili di bootstrap (INFISICAL_TOKEN e affini, vedi DEPLOY.md §9),
# mai i segreti applicativi veri. Lo legge scripts/docker-entrypoint.sh, non l'app
# direttamente. File creato a mano sul VPS, root-only (0600), mai committato.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .infisical-bootstrap.env
    environment:
      - NODE_ENV=production
      - BIND_HOST=0.0.0.0       # raggiungibile da Caddy sulla rete interna
    volumes:
      - perps-data:/app/data     # persistenza SQLite (bot, posizioni, chiavi agent cifrate)
    expose:
      - "3000"                   # solo rete interna, NON pubblicata sull'host
    networks: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # certificati Let's Encrypt
      - caddy-config:/config
    depends_on: [app]
    networks: [web]

networks:
  web:

volumes:
  perps-data:
  caddy-data:
  caddy-config:
