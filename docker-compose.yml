# Deploy di produzione: app (Node) + Caddy (reverse proxy).
# L'app NON è esposta all'host: solo Caddy pubblica una porta, e solo su
# 127.0.0.1 — mai raggiungibile da fuori l'host, nemmeno dalla tailnet
# direttamente. L'ingresso reale sulla tailnet è `tailscale serve` (fuori da
# Docker, gestito dall'host), che termina HTTPS con certificato reale
# (rinnovo automatico incluso, DEPLOY.md §3) e inoltra a Caddy su localhost.
# L'app è raggiungibile solo sulla rete interna Docker. SQLite persiste su un
# volume nominato.
#
# Segreti via Infisical (cloud o self-hosted), non .env in chiaro: .infisical-bootstrap.env
# contiene solo le 1-4 variabili di bootstrap (INFISICAL_TOKEN e affini, vedi DEPLOY.md §9),
# mai i segreti applicativi veri. Lo legge scripts/docker-entrypoint.sh, non l'app
# direttamente. File creato a mano sul VPS, root-only (0600), mai committato.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .infisical-bootstrap.env
    environment:
      - NODE_ENV=production
      - BIND_HOST=0.0.0.0       # raggiungibile da Caddy sulla rete interna
      # Senza questa, il container risolve UTC (immagine base) e ogni orario
      # formattato per l'utente (notifiche Telegram, "In cooldown fino alle…",
      # date nella UI) esce sbagliato di 1-2 ore secondo la stagione — non è
      # un problema di sincronizzazione (l'NTP dell'host è corretto), solo di
      # fuso. Europe/Rome, non un offset fisso: gestisce da sola CET/CEST.
      - TZ=Europe/Rome
    volumes:
      - perps-data:/app/data     # persistenza SQLite (bot, posizioni, chiavi agent cifrate)
    expose:
      - "3000"                   # solo rete interna, NON pubblicata sull'host
    networks: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # certificati Let's Encrypt (opzione B, dominio pubblico)
      - caddy-config:/config
    depends_on: [app]
    networks: [web]

  # ---------------------------------------------------------------------------
  # MONITORAGGIO (OBS-01) — profilo separato, spento per default
  # ---------------------------------------------------------------------------
  # `profiles: [monitoring]` fa sì che questi due servizi esistano solo con
  # `docker compose --profile monitoring up -d`. Un `docker compose up -d` senza
  # profilo continua a portare su esattamente app + caddy: il deploy attuale non
  # cambia, e chi non vuole monitoraggio non paga né RAM né superficie d'attacco.
  #
  # Nessuna porta nuova verso l'esterno: come Caddy, entrambi pubblicano solo su
  # 127.0.0.1. L'ingresso dalla tailnet lo dà `tailscale serve` sull'host, fuori
  # da Docker (docs/DEPLOY.md §6.1). Tra loro i due servizi si parlano per nome
  # sulla rete interna `web`, dove sta già l'app: Prometheus raggiunge app:3000
  # senza che /metrics venga esposto da nessuna parte.
  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # Solo per costruire il file di credenziali qui sotto. Se non è impostato,
      # l'app non controlla l'header e lo scrape funziona comunque.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    # Il token va in un file, non nella riga di comando né in prometheus.yml (che
    # è versionato). `$$` lascia il `$` alla shell DENTRO il container: se qui ci
    # fosse un solo `$`, Compose lo espanderebbe e il segreto finirebbe nella
    # command line, visibile a `docker inspect` e a chiunque possa leggerla.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ( umask 077; printf '%s' "$${METRICS_TOKEN:-nessun-token-configurato}" > /etc/prometheus/metrics_token )
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"    # solo loopback: per curl e diagnosi dall'host
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [web]

  # Alertmanager (OBS-02, issue #12) — il pezzo che trasforma una regola in
  # stato `firing` in un messaggio che arriva a qualcuno. Senza di lui,
  # Prometheus valuta gli alert e li mostra soltanto: il 14/09/2026 l'app è
  # rimasta in crash-loop ~3h40m con gli alert accesi e nessuno avvisato.
  #
  # Stesso profilo di prometheus/grafana: chi non vuole monitoraggio non paga
  # niente. Stessa rete `web`, così Prometheus lo raggiunge per nome
  # (`alertmanager:9093`) come già fa con `app:3000`. Stessa esposizione solo su
  # 127.0.0.1: la UI serve per silenziare un alert a mano durante una manutenzione.
  alertmanager:
    image: prom/alertmanager:v0.34.0
    profiles: [monitoring]
    restart: unless-stopped
    # I due segreti arrivano da un file DEDICATO, non da `.infisical-bootstrap.env`:
    # quello contiene anche AGENT_ENCRYPTION_KEY, SESSION_SECRET e
    # APP_PASSWORD_HASH, che in un container di notifica non hanno niente da
    # fare. Un container = solo i segreti che gli servono.
    # Il file va creato A MANO sul server, root-only (0600), mai committato
    # (è in .gitignore) — stessa disciplina di `.infisical-bootstrap.env`:
    #
    #   umask 077
    #   printf 'ALERTMANAGER_TELEGRAM_BOT_TOKEN=%s\n' "$BOT"  >  deploy/monitoring/alertmanager.secrets.env
    #   printf 'ALERTMANAGER_TELEGRAM_CHAT_ID=%s\n'  "$CHAT" >> deploy/monitoring/alertmanager.secrets.env
    #
    # `required: false` perché senza il file il servizio deve dare un errore
    # LEGGIBILE (vedi il controllo nel command), non un fallimento di Compose
    # prima ancora di partire.
    env_file:
      - path: ./deploy/monitoring/alertmanager.secrets.env
        required: false
    environment:
      # Orari leggibili nei log e nelle scadenze dei silence, come per l'app.
      - TZ=Europe/Rome
    # Token e chat id in FILE, non in alertmanager.yml (versionato) né in argv.
    # `$$` lascia il `$` alla shell DENTRO il container: con un solo `$` Compose
    # lo espanderebbe e il token del bot finirebbe nella command line, leggibile
    # con `docker inspect`. Identico al servizio prometheus qui sopra.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ( umask 077
          printf '%s' "$${ALERTMANAGER_TELEGRAM_BOT_TOKEN}" > /etc/alertmanager/telegram_bot_token
          printf '%s' "$${ALERTMANAGER_TELEGRAM_CHAT_ID}"   > /etc/alertmanager/telegram_chat_id )
        if [ ! -s /etc/alertmanager/telegram_bot_token ] || [ ! -s /etc/alertmanager/telegram_chat_id ]; then
          echo "❌ Alertmanager: bot token o chat id Telegram mancanti." >&2
          echo "   Crea deploy/monitoring/alertmanager.secrets.env (0600) con" >&2
          echo "   ALERTMANAGER_TELEGRAM_BOT_TOKEN e ALERTMANAGER_TELEGRAM_CHAT_ID." >&2
          exit 1
        fi
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.listen-address=:9093 \
          --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"    # solo loopback: UI per silenziare/ispezionare
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [web]

  grafana:
    image: grafana/grafana:13.1.3
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # Credenziali iniziali: admin/admin per default, così è Grafana stessa a
      # imporre il cambio password al primo accesso (non lo fa se qui arriva una
      # password personalizzata). Per impostarne una da subito:
      # GRAFANA_ADMIN_PASSWORD=... docker compose --profile monitoring up -d
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Nessun phone-home: coerente con l'allowlist di egress che la CI sta
      # profilando (SEC-03) e con un host che non deve chiamare fuori senza motivo.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    ports:
      - "127.0.0.1:3001:3000"    # 3001 sull'host: 3000 è la porta dell'app
    volumes:
      # Datasource e dashboard provisionate da file: al primo avvio la dashboard
      # c'è già, senza un clic nel browser.
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [web]

networks:
  web:

volumes:
  perps-data:
  caddy-data:
  caddy-config:
  prometheus-data:               # TSDB delle metriche (profilo monitoring)
  alertmanager-data:             # silence e notification log: senza persistenza,
                                 # un riavvio rimanderebbe gli alert già mandati
                                 # e cancellerebbe i silenzi di manutenzione
  grafana-data:                  # utenti, preferenze e stato di Grafana
